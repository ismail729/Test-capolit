<!DOCTYPE html>
<html>
<head>
<title>Calculator Cantik</title>
<style>
body{display:flex;justify-content:center;align-items:center;height:100vh;background:linear-gradient(135deg,#667eea,#764ba2);margin:0}
.calculator{background:#fff;padding:20px;border-radius:15px;box-shadow:0 10px 30px rgba(0,0,0,0.3)}
#display{width:240px;height:60px;font-size:28px;margin-bottom:15px;text-align:right;padding:10px;border:2px solid #667eea;border-radius:10px}
button{width:60px;height:60px;margin:5px;font-size:22px;border:none;border-radius:10px;background:#667eea;color:white}
button:hover{background:#764ba2}
</style>
</head>
<body>
<div class="calculator">
<input type="text" id="display" disabled><br>
<button onclick="display.value=''">C</button><button onclick="display.value+='/'">/</button><button onclick="display.value+='*'">*</button><button onclick="display.value+='-'">-</button><br>
<button onclick="display.value+='7'">7</button><button onclick="display.value+='8'">8</button><button onclick="display.value+='9'">9</button><button onclick="display.value+='+'">+</button><br>
<button onclick="display.value+='4'">4</button><button onclick="display.value+='5'">5</button><button onclick="display.value+='6'">6</button><button onclick="display.value=eval(display.value)">=</button><br>
<button onclick="display.value+='1'">1</button><button onclick="display.value+='2'">2</button><button onclick="display.value+='3'">3</button><button onclick="display.value+='0'">0</button>
</div>
</body>
</html>
